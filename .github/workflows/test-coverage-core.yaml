# name: test-coverage-core.yaml
# version: 1.0.0
# Description: Reusable workflow to compute test coverage and publish coverage-summary.json artifact

name: test-coverage-core

on:
  workflow_call:
    inputs:
      utils-ref:
        description: "Ref for gsm.utils to install"
        type: string
        default: '@*release'
    secrets:
      token:
        description: "GitHub token, set to secrets.GITHUB_TOKEN"
        required: false
      app-id:
        required: false
      app-private-key:
        required: false

jobs:
  coverage:
    # data-* releases publish test data, not code; skip coverage for them.
    if: >-
      github.event_name != 'release' ||
      !startsWith(github.event.release.tag_name, 'data-')
    runs-on: ubuntu-latest
    # No job-level permissions: inherit the caller's grant, so callers that
    # don't yet grant actions: read (needed for PR test data bundles) still run.
    steps:
      - name: Generate token
        uses: $/generate-token
        id: token
        with:
          app-id: ${{ secrets.app-id }}
          app-private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          fallback-token: ${{ secrets.token || github.token }}
      - name: Compute test coverage
        uses: $/coverage
        with:
          utils-ref: ${{ inputs.utils-ref }}
          token: ${{ steps.token.outputs.token }}
